name: RoHub / RoTruyen checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/rohub-rotruyen-foundation-20261009"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
      - name: Verify RoHub entry points and isolated assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s roflix.html
          test -s rotruyen.html
          test -s rotruyen-account.html
          test -s rotruyen-admin.html
          test -s css/rohub.css
          test -s js/rohub.js
          test -s css/rotruyen/main.css
          test -s css/rotruyen/account.css
          test -s css/rotruyen/admin.css
          test -s js/rotruyen/app.js
          test -s js/rotruyen/account.js
          test -s js/rotruyen/admin.js
          test -s supabase/migrations/20261009000000_rotruyen_admin.sql
          grep -q 'js/rotruyen/app.js' rotruyen.html
          grep -q 'js/rotruyen/account.js' rotruyen-account.html
          grep -q 'signInWithPassword' js/rotruyen/account.js
          grep -q 'rohub-theme' js/rotruyen/account.js
          grep -q 'js/rotruyen/admin.js' rotruyen-admin.html
          ! grep -Eiq 'service[_-]?role|SUPABASE_SERVICE_ROLE_KEY' js/config/supabase.config.js
      - name: Check migration safety primitives
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'enable row level security' supabase/migrations/20261009000000_rotruyen_admin.sql
          grep -q 'Active admins manage RoTruyen series' supabase/migrations/20261009000000_rotruyen_admin.sql
          grep -q 'Only active admins read RoTruyen audit logs' supabase/migrations/20261009000000_rotruyen_admin.sql
